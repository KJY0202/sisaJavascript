<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>영화관 좌석 예약</title>
    <script src="movie.js" defer></script>
    <link rel="stylesheet" href="movie.css" />
  </head>
  <body>
    <section class="movie">
      <header class="movie__header">
        <p class="eyebrow">CINEMA RESERVATION</p>
        <h1>영화관 좌석 예약</h1>
        <p>원하는 좌석을 선택해 주세요.</p>
      </header>
      <label class="movieSelect" for="movieSelect">
        영화 선택
        <select id="movieSelect">
          <option value="12000">인터스텔라 · 12,000원</option>
          <option value="13000">라라랜드 · 13,000원</option>
          <option value="11000">센과 치히로의 행방불명 · 11,000원</option>
        </select>
      </label>
      <div class="screen">SCREEN</div>
      <div class="seatLegend" aria-label="좌석 상태 안내">
        <span><i class="legend available"></i>선택 가능</span>
        <span><i class="legend selected"></i>선택됨</span>
        <span><i class="legend reserved"></i>예약 완료</span>
      </div>
      <div class="seatList" aria-label="좌석 목록"></div>
      <div class="summary">
        <div>
          <span>선택 좌석</span><strong id="selectedSeats">없음</strong>
        </div>
        <div><span>결제 금액</span><strong id="totalPrice">0원</strong></div>
        <button id="reserveButton" type="button" disabled>예약하기</button>
      </div>
      <p id="message" class="message" role="status"></p>
    </section>
  </body>
</html>
